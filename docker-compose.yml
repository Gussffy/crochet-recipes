version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crochet-recipes-api
    ports:
      - "${APP_PORT}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MONGODB_URI=mongodb://mongo:${MONGO_PORT}/${MONGO_DATABASE}
      - JAVA_OPTS=${JAVA_OPTS}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - crochet-network
    restart: unless-stopped
    volumes:
      - app-logs:/app/logs

  mongo:
    image: mongo:7.0
    container_name: crochet-recipes-mongo
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - crochet-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: crochet-recipes-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=${MONGO_PORT}
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_PASSWORD}
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - crochet-network
    restart: unless-stopped

networks:
  crochet-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  app-logs:
    driver: local
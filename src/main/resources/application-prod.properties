spring.mongodb.uri=${MONGODB_URI:mongodb://mongo:27017/crochet_recipes}
spring.data.mongodb.auto-index-creation=false

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

logging.level.com.crochet.recipes=INFO
logging.level.org.springframework.data.mongodb=WARN

cors.allowed-origins=https://laillycrafts.com,https://www.laillycrafts.com

# JWT Configuration
app.jwtSecret=${JWT_SECRET:your-secret-key-change-this-in-production-environment-with-at-least-32-characters}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}


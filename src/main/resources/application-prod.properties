# ===========================
# Perfil PROD
# ===========================
# Em producao, priorize informar MONGODB_URI via variavel de ambiente.
spring.mongodb.uri=${MONGODB_URI:mongodb://mongo:27017/crochet_recipes}
spring.data.mongodb.auto-index-creation=false

# Swagger / OpenAPI desabilitado em producao
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Logs mais conservadores
logging.level.com.crochet.recipes=INFO
logging.level.org.springframework.data.mongodb=WARN
